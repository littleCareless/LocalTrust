name: 💡 Feature Request
description: 为 LocalTrust 提出新功能建议
labels: ["feature request", "triage"]
body:

  - type: markdown
    attributes:
      value: |
        感谢您提出功能建议！请填写以下信息以帮助我们评估和实现。

  - type: textarea
    id: summary
    label: 功能摘要
    description: "请用一两句话简述您的功能建议"
    validations:
      required: true

  - type: textarea
    id: problem
    label: 解决的问题
    description: "这个功能要解决什么问题？为什么要这个功能？"
    placeholder: |
      作为一名 [角色]，我希望 [功能]，以便 [价值]。
    validations:
      required: true

  - type: textarea
    id: solution
    label: 建议的解决方案
    description: "您认为这个功能应该如何实现？"
    validations:
      required: true

  - type: textarea
    id: alternatives
    label: 替代方案
    description: "您是否考虑过其他解决方案或变通方法？"

  - type: type
    id: additional-context
    label: 附加上下文
    description: "请添加任何其他相关上下文或参考资料（如截图、设计草图等）"

  - type: checkboxes
    id: requirements
    label: 贡献意愿
    options:
      - label: "我愿意为这个功能贡献代码"
      - label: "我愿意帮助测试这个功能"
      - label: "我愿意编写文档"
