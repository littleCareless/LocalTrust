version: '3.8'

services:
  localtrust:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: localtrust
    restart: unless-stopped
    ports:
      - "80:80"        # Web 界面
      - "3001:3001"    # API 端口（可选，用于直接访问）
    volumes:
      # 持久化数据目录
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - CORS_ORIGIN=http://localhost
    extra_hosts:
      # 添加自定义 hosts 映射
      - "localtrust.local:127.0.0.1"
    networks:
      - localtrust-network

networks:
  localtrust-network:
    driver: bridge
